# nginx config for the ShelfFinder container (included inside nginx's http block).

# The page, the offline helper and the manifest are always re-checked so updates show up;
# icons can be cached for a day.
map $uri $sf_cache {
  ~^/(index\.html|sw\.js|manifest\.webmanifest)?$  "no-cache";
  default                                          "public, max-age=86400";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header Cache-Control $sf_cache always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    try_files $uri $uri/ =404;
  }

  location ~ \.webmanifest$ {
    types { }
    default_type application/manifest+json;
  }
}
