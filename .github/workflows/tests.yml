# Runs on every push to main (and on pull requests).
# 1. Rebuilds index.html from src/ and fails if the committed copy is out of date.
# 2. Runs the three test suites (core logic, catalog proxy, whole app with a fake catalog).
# 3. Builds the Docker image, runs it and checks the site it serves.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: index.html matches src/ (run python3 build.py before committing)
        run: |
          python3 build.py
          if ! git diff --quiet -- index.html; then
            echo "::error file=index.html::index.html is out of date with src/. Run python3 build.py and commit the result."
            git diff --stat -- index.html
            exit 1
          fi

      - name: Core logic tests
        run: node tests/core.test.js

      - name: Catalog proxy tests
        run: node tests/proxy.test.js

      - name: App + live catalog tests
        run: node tests/app-live.test.js

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t shelffinder .

      - name: Run it and check what it serves
        run: |
          docker run -d --name sf -p 8080:8080 shelffinder
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          diff <(curl -fsS http://localhost:8080/) index.html && echo "page matches index.html"
          curl -fsSI http://localhost:8080/sw.js | grep -i '^cache-control: no-cache'
          curl -fsSI http://localhost:8080/manifest.webmanifest | grep -i '^content-type: application/manifest+json'
          curl -fsS -o /dev/null http://localhost:8080/icons/icon-192.png && echo "icons served"
          test "$(docker exec sf id -u)" != "0" && echo "runs as non-root"

      - name: Container logs
        if: always()
        run: docker logs sf || true
